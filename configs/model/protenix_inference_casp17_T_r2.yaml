# @package _global_
# CASP17 T-series round 2 — same input as r1, fresh seeds 201..210.
# r1/r2 share the input JSON and produce 50 + 50 = 100 models / target for
# the ensemble. MSA cache (enable_cache) is reused from r1.

dataset: casp17_T
input_dir: data/test_cases/${dataset}/protenix_inputs
output_dir: outputs/protenix/${dataset}_r2

env_name: protenix
gpu_device: 1

protenix_root_dir: weights/protenix
seqres_database_path: ${oc.env:AF3_DB_DIR,/bmlfast/databases}/pdb_seqres_2022_09_28.fasta
msa_dir: null

model_name: protenix_base_default_v1.0.0
seeds: "201,202,203,204,205,206,207,208,209,210"
dtype: bf16

use_msa: true
use_template: true
use_rna_msa: false
enable_cache: true

cycle: 10
step: 200
n_sample: 5

targets: []
override: false
