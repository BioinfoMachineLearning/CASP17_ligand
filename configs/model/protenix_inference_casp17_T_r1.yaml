# @package _global_
# CASP17 T-series round 1 — protein-ligand inference.
#
# Run:
#   PROTENIX_ROOT_DIR=$(pwd)/weights/protenix \
#     conda run -n casp17_ligand python casp17_ligand/models/protenix_inference.py \
#     --config-name protenix_inference_casp17_T_r1
#
# Input JSONs are read from data/test_cases/casp17_T/protenix_inputs/ (shared
# across r1/r2). Output lands in outputs/protenix/casp17_T_r1/{target}/seed_*/.
# Protein targets: Protenix runs its own paired/unpaired MSA + hmmer template
# search at inference (no pre-search needed). For repeated runs on the same
# target, `enable_cache: true` lets r2 + dual-ckpt reuse the searched MSAs.

dataset: casp17_T
input_dir: data/test_cases/${dataset}/protenix_inputs
output_dir: outputs/protenix/${dataset}_r1

env_name: protenix
gpu_device: 1

protenix_root_dir: weights/protenix
# Template search database (used by Protenix internal hmmsearch)
seqres_database_path: ${oc.env:AF3_DB_DIR,/bmlfast/databases}/pdb_seqres_2022_09_28.fasta
# Pre-computed MSA dir (null = let Protenix run its own search)
msa_dir: null

model_name: protenix_base_default_v1.0.0
seeds: "101,102,103,104,105,106,107,108,109,110"   # 10 seeds → 50 models
dtype: bf16   # V100 silently runs FP32; no quality loss

use_msa: true
use_template: true
use_rna_msa: false       # protein series
enable_cache: true       # share MSA cache across r1/r2/dual-ckpt invocations

cycle: 10
step: 200
n_sample: 5              # 10 seeds × 5 samples = 50 models / target

targets: []
override: false
