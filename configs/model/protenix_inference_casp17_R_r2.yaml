# @package _global_
# CASP17 R-series round 2 — same input as r1, fresh seeds 201..210.
# r1/r2 share the patched JSON (rnaSequence has unpairedMsaPath) and produce
# 50 + 50 = 100 models / target for the ensemble.

dataset: casp17_R
input_dir: data/test_cases/${dataset}/protenix_inputs
output_dir: outputs/protenix/${dataset}_r2

env_name: protenix
gpu_device: 1

protenix_root_dir: /bmlfast/Lyuwei/0.Projects/CASP17_ligand/weights/protenix

seqres_database_path: null
msa_dir: null

model_name: protenix_base_default_v1.0.0
seeds: "201,202,203,204,205,206,207,208,209,210"   # r2 seeds
dtype: bf16

use_msa: true
use_template: false
use_rna_msa: true
enable_cache: true

cycle: 10
step: 200
n_sample: 5

targets: []
override: false
