# @package _global_
# CASP17 protein-with-ligand series (T2383 etc.)
#
# Run:
#   conda run -n casp17_ligand python casp17_ligand/data/boltz2_input_preparation.py \
#       --config-name boltz2_input_preparation_casp17_T

dataset: casp17_T
series: CASP17_T
data_root: data/casp17_data
input_csv_filepath: data/test_cases/${dataset}/ensemble_inputs.csv
output_dir: data/test_cases/${dataset}/boltz2_inputs

predict_affinity: false   # CASP17 task=P (pose-only); affinity head adds compute, not used by ensemble
msa_path: null            # null = Boltz-2 runs its own MSA at inference (protein-ligand standard)
struct_only: false        # CASP17 in-progress: no GT struct yet

# Target scope. null/unset = whole series (benchmark & eval mode).
# Competition mode: restrict to specific ids so a re-run does NOT rewrite
# inputs for targets already running or already submitted (some carry
# hand-injected MSA paths). Override on the CLI:
#   targets=T2413v1            or   targets=T2413v1,T2414v1
targets: null
